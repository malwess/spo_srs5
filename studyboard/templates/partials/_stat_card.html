{# Карточка-счётчик. Параметры: icon, color, value, label, counter #}
<div class="card card-sm">
    <div class="card-body">
        <div class="row align-items-center">
            <div class="col-auto">
                <span class="bg-{{ color }} text-white avatar"><i class="ti ti-{{ icon }} fs-2"></i></span>
            </div>
            <div class="col">
                <div class="h2 mb-0" {% if counter %}data-counter="{{ counter }}"{% endif %}>{{ value }}</div>
                <div class="text-secondary">{{ label }}</div>
            </div>
        </div>
    </div>
</div>
